<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConquerAlert</title>

  <body>
    <canvas id="game"></canvas>
    <div id="hud-top" class="hud"></div>
    <div id="hud-sel" class="hud"></div>
    <div id="hud-help" class="hud">
      Click: selectează (unități / clădiri) · Drag: dreptunghi · Shift: adaugă · Dublu-click: același tip ·
      Click dreapta: mută / atacă / recoltează · Ctrl+click dreapta sau F: attack-move · X: stop · Ctrl+1–9: grup · WASD / margini: cameră · Rotiță: zoom · P: pauză
    </div>
